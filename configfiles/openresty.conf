user www-data www-data;

worker_processes auto;
worker_cpu_affinity auto;

worker_rlimit_nofile     16384;
worker_shutdown_timeout  45s;

error_log  logs/error.log warn;
pid        logs/nginx.pid;

pcre_jit on;

events {
    worker_connections  8192;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    index         index.html index.php;

    map $time_iso8601 $ttyyyy {
        volatile;
        default "9999";
        "~^(\d{4})-(\d{2})-(\d{2})" $1;
    }
    map $time_iso8601 $ttmm {
        volatile;
        default "99";
        "~^(\d{4})-(\d{2})-(\d{2})" $2;
    }
    map $time_iso8601 $ttdd {
        volatile;
        default "99";
        "~^(\d{4})-(\d{2})-(\d{2})" $3;
    }
    map $status $http_status_level {
        volatile;
        default "xxx";
        "~^1\d{2}$" "1xx";
        "~^2\d{2}$" "2xx";
        "~^3\d{2}$" "3xx";
        "~^4\d{2}$" "4xx";
        "~^5\d{2}$" "5xx";
    }

    log_format json_log_format escape=json
      '{'
        '"time_iso8601":"$time_iso8601",'
        '"remote_addr":"$remote_addr",'
        '"http_x_forwarded_for":"$http_x_forwarded_for",'
        '"server_name":"$server_name",'
        '"host":"$host",'
        '"server_protocol":"$server_protocol",'
        '"content_type":"$content_type",'
        '"content_length":"$content_length",'
        '"request_method":"$request_method",'
        '"request_uri":"$request_uri",'
        '"query_string":"$query_string",'
        '"request_time":"$request_time",'
        '"status":"$status",'
        '"body_bytes_sent":"$body_bytes_sent",'
        '"http_referer":"$http_referer",'
        '"http_user_agent":"$http_user_agent",'
        '"msec":$msec'
      '}';

    access_log  logs/json.$ttyyyy.$ttmm.$http_status_level.log json_log_format;

    server_tokens  off;
    etag           on;

#    sendfile     on;
#    tcp_nopush   on;
#    tcp_nodelay  on;

    client_body_buffer_size    16k;
    client_max_body_size       8m;
    client_body_timeout        60s;

    keepalive_timeout          75s;
    keepalive_requests         100;
    reset_timedout_connection  on;

    gzip             on;
    gzip_comp_level  3;
    gzip_min_length  1024;
    gzip_types       text/plain text/css application/javascript application/json application/xml;
    # gzip_proxied     off;
    # gzip_vary        on;

    add_header  X-Frame-Options         SAMEORIGIN;
    add_header  X-Content-Type-Options  nosniff;


    server {
        listen         80 default;
        server_name    _;
        root           /var/www/ip_site;

        location ~ \.php {
            fastcgi_pass 127.0.0.1:9000;
            # see https://github.com/zendtech/ZendOptimizerPlus/issues/126
            include fastcgi_params;
            fastcgi_param SCRIPT_FILENAME  $realpath_root$fastcgi_script_name;
            fastcgi_param DOCUMENT_ROOT    $realpath_root;
        }
    }
}
