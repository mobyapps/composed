name: ci2

on:
  push:

jobs:
  build:
    name: Build on ubuntu-24.04
    if: "contains(github.event.head_commit.message, 'release ubuntu24-php83-mysql80.rv4')"

    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - name: Check os env
        run: |
          localectl status
          cat /proc/cpuinfo
          free -m

      - name: Build image
        run: docker build -f src/ubuntu24-php83-mysql80/Dockerfile -t charescape/web:ubuntu24-php83-mysql80.rv4 .

      - run: docker image ls

      - name: Login to DockerHub
        run: echo "${{ secrets.DOCHUB_PASSWORD }}" | docker login --username ${{ secrets.DOCHUB_USERNAME }} --password-stdin

      - name: Push image
        run: docker push charescape/web:ubuntu24-php83-mysql80.rv4
