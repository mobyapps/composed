user www-data www-data;

worker_processes auto;
worker_cpu_affinity auto;
worker_rlimit_nofile 16384;

error_log  logs/error.log warn;
pid        logs/nginx.pid;

# pcre_jit on;

load_module modules/ngx_http_vhost_traffic_status_module.so;

events {
    worker_connections 2048;
}

http {
    charset utf-8;
    charset_types text/plain text/css text/xml text/vnd.wap.wml
                  application/json application/manifest+json application/xml
                  application/javascript text/javascript application/x-javascript
                  application/rss+xml application/xhtml+xml image/svg+xml application/atom+xml;

    include       mime.types;
    default_type  application/octet-stream;
    index         index.html index.php;

    sendfile       on;
    tcp_nopush     on;
    tcp_nodelay    on;
    server_tokens  off;
    etag           on;

    client_max_body_size       32m;
#    client_body_timeout        60s; # 408 (Request Time-out)
#    keepalive_timeout          75s;
#    keepalive_requests         1000;


    map $time_iso8601 $ttyyyy {
        volatile;
        default "9999";
        "~^(\d{4})-(\d{2})-(\d{2})" $1;
    }
    map $time_iso8601 $ttmm {
        volatile;
        default "99";
        "~^(\d{4})-(\d{2})-(\d{2})" $2;
    }
    map $time_iso8601 $ttdd {
        volatile;
        default "99";
        "~^(\d{4})-(\d{2})-(\d{2})" $3;
    }
    map $status $status_xxx {
        volatile;
        default "xxx";
        "~^1\d{2}$" "1xx";
        "~^2\d{2}$" "2xx";
        "~^3\d{2}$" "3xx";
        "~^4\d{2}$" "4xx";
        "~^5\d{2}$" "5xx";
    }
    map $uri $with_static_ext {
        volatile;
        default "";
        "~*\.(css|woff|woff2|js|jpg|jpeg|png|webp|ico)$" ".static";
    }
    map $http_user_agent $with_spider_ext {
        volatile;
        default "";
        "~*(baidu|sogou|bing|google|yandex|toutiao)\.com" ".spider";
    }

    log_format  fmtv3 '$remote_addr ;;; $http_x_forwarded_for ;;; $time_iso8601 ;;; '
                       '$server_name ;;; $host ;;; $server_protocol ;;; $content_type ;;; $content_length ;;; $request_completion ;;; '
                       '$request_method ;;; $request_uri ;;; $query_string ;;; '
                       '$request_time ;;; $status ;;; $body_bytes_sent ;;; $http_referer ;;; $http_user_agent ;;; $msec';

    log_format json_log_format escape=json
      '{'
        '"time_iso8601":"$time_iso8601",'
        '"remote_addr":"$remote_addr",'
        '"http_x_forwarded_for":"$http_x_forwarded_for",'
        '"server_name":"$server_name",'
        '"host":"$host",'
        '"server_protocol":"$server_protocol",'
        '"content_type":"$content_type",'
        '"content_length":"$content_length",'
        '"request_method":"$request_method",'
        '"request_uri":"$request_uri",'
        '"query_string":"$query_string",'
        '"request_time":"$request_time",'
        '"status":"$status",'
        '"body_bytes_sent":"$body_bytes_sent",'
        '"http_referer":"$http_referer",'
        '"http_user_agent":"$http_user_agent",'
        '"msec":$msec'
      '}';

    access_log  logs/json.$ttyyyy.$ttmm.$status_xxx$with_spider_ext$with_static_ext.log json_log_format;


    gzip             on;
    gzip_comp_level  5;
    gzip_min_length  1024;
    gzip_types       text/plain text/css application/javascript application/json application/xml
                     text/javascript application/x-javascript application/rss+xml
                     text/xml application/xhtml+xml image/svg+xml application/atom+xml;
    # gzip_proxied     off;
    gzip_vary        on;


    limit_conn_zone $binary_remote_addr zone=conn_perip_php:16m;
    limit_conn_log_level warn;
    limit_conn_status 444;

    limit_req_zone $binary_remote_addr  zone=req_perip_php:16m             rate=15r/s;
    limit_req_zone $binary_remote_addr  zone=req_perip_php_per_minute:16m  rate=300r/m;
    limit_req_log_level warn;
    limit_req_status 444;


    lua_shared_dict dogs 16m;


    vhost_traffic_status_zone;
    vhost_traffic_status_filter_by_host on;


    server {
        listen      80  default_server;
        listen [::]:80  default_server;
        server_name    _;
        root           /repos/emptydir;

        location ~ \.php {
            fastcgi_pass 127.0.0.1:9000;
            fastcgi_split_path_info ^(.+\.php)(/.*)$;
            # see https://github.com/zendtech/ZendOptimizerPlus/issues/126
            include fastcgi_params;
            fastcgi_param SCRIPT_FILENAME  $realpath_root$fastcgi_script_name;
            fastcgi_param DOCUMENT_ROOT    $realpath_root;
        }
    }

    server {
        listen       80;
        listen  [::]:80;
        server_name  php-crud-api.com;
        root         /repos/php-crud-api;
        index        index.php;

        location / {
            try_files $uri /index.php$is_args$args;
        }

        location ~ ^/index\.php(/|$) {
            fastcgi_pass 127.0.0.1:9000;
            fastcgi_split_path_info ^(.+\.php)(/.*)$;

            include fastcgi_params;
            fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
            fastcgi_param DOCUMENT_ROOT $realpath_root;

            fastcgi_read_timeout 300;

            internal;
        }

        location ~ \.php$ {
            return 403;
        }
    }

    server {
        listen       80;
        listen  [::]:80;
        server_name  app.yiitest.com;
        root         /repos/yiitest/latest/web;
        index        index.php;

        location / {
            try_files $uri $uri/ /index.php$is_args$args;
        }

        location = /favicon.ico {
            access_log     off;
            log_not_found  off;
        }

        location ~ /\. {
            deny all;
        }

        location ~* \.(js|css|map|gif|jpg|jpeg|png|ico|ttf|eot|otf|woff|woff2)$ {
            try_files $uri =404;
        }

        location ~ ^/index\.php(/|$) {
            fastcgi_pass 127.0.0.1:9000;
            fastcgi_split_path_info ^(.+\.php)(/.*)$;

            include fastcgi_params;
            fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
            fastcgi_param DOCUMENT_ROOT $realpath_root;

